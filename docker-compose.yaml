version: '3.1'

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - '18869:15672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rswd_188679_network

  mongo:
    image: mongo:4.4.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - rswd_188679_network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  
  reservation-service:
    image: jjayjohnny/rswd_188679_reservation_service:latest
    container_name: reservation-service
    environment:
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__MySql: Server=admin-mysql_db;Database=rswd_188679_reservation_service;User=root;Password=student;SslMode=none;
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rswd_188679_network
      - admin-mysql_default

  offer-service:
    image: jjayjohnny/rswd_188679_offer_service:latest
    container_name: offer-service
    environment:
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__MySql: Server=admin-mysql_db;Database=rswd_188679_offer_service;User=root;Password=student;SslMode=none;
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
    - rswd_188679_network
    - admin-mysql_default

  payment-service:
    image: jjayjohnny/rswd_188679_payment_service:latest
    container_name: payment-service
    environment:
      MongoDBSettings__ConnectionString: mongodb://user:password@mongo:27017/PaymentsDB
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
    - rswd_188679_network
  
  notification-service:
    image: jjayjohnny/rswd_188679_notification_service:latest
    container_name: notification-service
    environment:
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rswd_188679_network
   
  api-gateway:
    image: jjayjohnny/rswd_188679_api_gateway:latest
    container_name: api-gateway
    ports:
      - '18868:8080'
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rswd_188679_network  

  frontend:
    image: jjayjohnny/rswd_188679_frontend:latest
    container_name: frontend
    ports:
      - '18867:80'
    environment:
      API_URL: http://api-gateway:8080/api
      NOTIFICATION_URL: http://api-gateway:8080/notifications
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rswd_188679_network
  
  generator:
    image: jjayjohnny/rswd_188679_generator:latest
    container_name: generator
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 70s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__ApiHost: http://api-gateway:8080/api/
      GENERATOR_DELAY_SECONDS: "15"
    networks:
      - rswd_188679_network

networks:
  rswd_188679_network:
  admin-mysql_default:
    external: true
    
