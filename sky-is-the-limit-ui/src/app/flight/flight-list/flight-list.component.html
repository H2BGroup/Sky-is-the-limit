<div class="p-24">
  <mat-accordion>
    @for (flight of flights$ | async; track flight.id; let i = $index) {
    <mat-expansion-panel [class.mt-8]="i > 0" [id]="'panel-' + i">
      <mat-expansion-panel-header>
        <div class="d-flex justify-content-between w-100 align-items-center">
          <h6 class="mb-0 me-16 truncate" tooltipIfTruncated>
            {{ createFlightSummary(flight) }}
          </h6>
        </div>
      </mat-expansion-panel-header>
      <div class="px-24">
        <div class="info-row">
          <div class="info-item">
            <h2>Departure</h2>
            <h3>{{ flight.departure }}</h3>
          </div>
          <div class="info-item">
            <h2>Arrival</h2>
            <h3>{{ flight.arrival }}</h3>
          </div>
          <div class="info-item">
            <h2>Price</h2>
            <h3>{{ flight.price }} zł</h3>
          </div>
        </div>
        <div class="button-row">
          <button (click)="onBookFlight(flight.id)">Book</button>
        </div>
      </div>
    </mat-expansion-panel>
    }
  </mat-accordion>
</div>
